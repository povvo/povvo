<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Ethan Lee Barrett. Public work: every repository as a case on a revolving rack. Turn the rack, take a case out, open it to read." />
    <meta property="og:title" content="Ethan Lee Barrett — public work" />
    <meta property="og:description" content="Every repository as a case on a revolving rack. Turn the rack, take a case out, open it to read." />
    <meta property="og:type" content="website" />
    <title>Ethan Lee Barrett — public work</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body data-state="loading" data-motion="full" data-renderer="pending">
    <a class="skip" href="#index-open">Skip to the index</a>

    <main class="stage" aria-labelledby="stage-title">
      <h2 id="stage-title" class="sr-only">The rack</h2>

      <div class="hero" aria-hidden="true" data-hero data-state="off"></div>

      <div class="stage__field" data-field>
        <canvas id="rack" class="stage__canvas" aria-hidden="true"></canvas>
        <div class="stage__flat" data-flat hidden aria-hidden="true"></div>
      </div>

      <header class="bar">
        <h1 class="bar__name">Ethan Lee Barrett</h1>
        <p class="bar__line">Public work, <span data-count>—</span></p>
        <p class="bar__hint"><span class="bar__hint--keys">Drag, scroll or <kbd>←</kbd> <kbd>→</kbd> to turn</span><span class="bar__hint--touch">Swipe sideways to turn</span></p>
        <nav class="bar__nav" aria-label="Site">
          <button class="bar__link" type="button" id="index-open" data-index-open aria-haspopup="dialog" aria-controls="index">Index <span class="bar__count" data-tally></span></button>
          <button class="bar__link" type="button" data-motion-toggle aria-pressed="false">Motion on</button>
          <a class="bar__link" href="https://github.com/povvo" rel="me">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </header>

      <section class="caption" data-caption aria-label="The case out of the rack">
        <p class="caption__no" data-no>&nbsp;</p>
        <h3 class="caption__title" data-title>Loading the catalogue</h3>
        <p class="caption__desc" data-desc></p>
        <p class="caption__meta" data-meta></p>
        <button class="caption__open" type="button" data-open hidden><span class="caption__label">Open the case</span> <kbd aria-hidden="true">↵</kbd></button>
      </section>

      <nav class="turn" aria-label="Neighbouring projects" data-turn>
        <button class="turn__btn" type="button" data-prev><span class="turn__dir">Previous</span><span class="turn__name" data-prev-name></span></button>
        <button class="turn__btn" type="button" data-next><span class="turn__dir">Next</span><span class="turn__name" data-next-name></span></button>
      </nav>

      <p class="stage__status sr-only" role="status" aria-live="polite" data-status></p>
    </main>

    <section class="index" id="index" role="dialog" aria-modal="true" aria-labelledby="index-title" data-index hidden>
      <div class="index__sheet">
        <header class="index__head">
          <h2 id="index-title" class="index__title">Index</h2>
          <p class="index__tally" data-index-tally></p>
          <label class="index__find"><span class="sr-only">Find a project</span><input type="search" data-find placeholder="Find a project" autocomplete="off" spellcheck="false" /></label>
          <div class="index__order" role="group" aria-label="Order">
            <button type="button" data-order-value="accession" aria-pressed="true">Oldest</button>
            <button type="button" data-order-value="updated" aria-pressed="false">Updated</button>
            <button type="button" data-order-value="name" aria-pressed="false">A–Z</button>
            <button type="button" data-order-value="stars" aria-pressed="false">Stars</button>
          </div>
          <button class="index__close" type="button" data-index-close>Close <kbd>Esc</kbd></button>
        </header>
        <ul class="tracklist" role="listbox" aria-label="Projects" tabindex="0" data-list></ul>
        <p class="index__empty" data-empty hidden>Nothing in the catalogue matches that.</p>
        <footer class="index__foot"><span data-source></span><span>github.com/povvo</span></footer>
      </div>
    </section>

    <section class="spread" role="dialog" aria-modal="false" aria-labelledby="spread-title" data-booklet hidden>
      <div class="spread__sheet" data-booklet-sheet>
        <header class="spread__head">
          <div class="spread__bar">
            <span class="spread__no" data-booklet-no></span>
            <button class="spread__close" type="button" data-booklet-close aria-label="Close the case">Close <kbd>Esc</kbd></button>
          </div>
          <div class="spread__logo" data-booklet-logo aria-hidden="true"></div>
          <h2 class="spread__title" id="spread-title" data-booklet-title></h2>
        </header>
        <dl class="spread__protocol" data-booklet-meta></dl>
        <p class="spread__standfirst" data-booklet-desc></p>
        <p class="spread__links"><a class="spread__link" data-booklet-link href="#" target="_blank" rel="noopener">Open on GitHub <span aria-hidden="true">↗</span></a></p>
        <div class="spread__body" data-booklet-body>
          <p class="spread__state">Fetching the README from GitHub</p>
        </div>
      </div>
    </section>

    <noscript>
      <div class="noscript">
        <p>The rack needs JavaScript. The projects live at <a href="https://github.com/povvo?tab=repositories">github.com/povvo</a>.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
